schema:
  rules:
    configs:
      PrometheusPort:
        type: string
        required: true
        editableBy:
          - OT
      AiMqBrokerAddress:
        type: string
        required: true
        editableBy:
          - OT
      AiMqBrokerPort:
        type: int
        required: true
        editableBy:
          - OT
      DeploymentName:
        type: string
        required: true
        editableBy:
          - OT
configs:
  PrometheusPort: ${{$val(PrometheusPort)}}
  AiMqBrokerAddress: ${{$val(AiMqBrokerAddress)}}
  AiMqBrokerPort: ${{$val(AiMqBrokerPort)}}
  DependencyConfigs: []
  DeploymentName: ${{$val(DeploymentName)}}