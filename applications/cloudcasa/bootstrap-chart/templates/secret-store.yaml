{{- $tenantId := required "secretStore.tenantId is required" .Values.secretStore.tenantId -}}
{{- $keyVaultName := required "secretStore.keyVaultName is required" .Values.secretStore.keyVaultName -}}
{{- $clientId := required "secretStore.clientId is required" .Values.secretStore.clientId -}}
{{- $serviceAccountName := required "secretStore.serviceAccountName is required" .Values.secretStore.serviceAccountName -}}
{{- $secretProviderClassName := required "secretStore.secretProviderClassName is required" .Values.secretStore.secretProviderClassName -}}
{{- $registryKeyVaultSecret := required "secretStore.registryDockerConfigSecretName is required" .Values.secretStore.registryDockerConfigSecretName -}}
{{- $licenseKeyVaultSecret := required "secretStore.licenseKeyVaultSecretName is required" .Values.secretStore.licenseKeyVaultSecretName -}}
{{- $serverNamespace := required "namespaces.server is required" .Values.namespaces.server -}}
{{- $mongoNamespace := required "namespaces.mongo is required" .Values.namespaces.mongo -}}
{{- range $namespace := list $serverNamespace $mongoNamespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  namespace: {{ $namespace }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $secretProviderClassName }}
  namespace: {{ $namespace }}
spec:
  provider: azure
  parameters:
    clientID: {{ $clientId | quote }}
    keyvaultName: {{ $keyVaultName | quote }}
    tenantID: {{ $tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ $registryKeyVaultSecret }}
          objectType: secret
{{- if eq $namespace $serverNamespace }}
        - |
          objectName: {{ $licenseKeyVaultSecret }}
          objectType: secret
{{- if $.Values.localAuthenticationEnabled }}
        - |
          objectName: {{ required "secretStore.localAdminUsernameSecretName is required" $.Values.secretStore.localAdminUsernameSecretName }}
          objectType: secret
        - |
          objectName: {{ required "secretStore.localAdminEmailSecretName is required" $.Values.secretStore.localAdminEmailSecretName }}
          objectType: secret
        - |
          objectName: {{ required "secretStore.localAdminPasswordSecretName is required" $.Values.secretStore.localAdminPasswordSecretName }}
          objectType: secret
{{- end }}
{{- end }}
---
apiVersion: secret-sync.x-k8s.io/v1alpha1
kind: SecretSync
metadata:
  name: {{ required "kubernetesSecrets.registry is required" $.Values.kubernetesSecrets.registry }}
  namespace: {{ $namespace }}
spec:
  serviceAccountName: {{ $serviceAccountName }}
  secretProviderClassName: {{ $secretProviderClassName }}
  secretObject:
    type: kubernetes.io/dockerconfigjson
    data:
      - sourcePath: {{ $registryKeyVaultSecret }}
        targetKey: .dockerconfigjson
{{- if eq $namespace $serverNamespace }}
---
apiVersion: secret-sync.x-k8s.io/v1alpha1
kind: SecretSync
metadata:
  name: {{ required "kubernetesSecrets.license is required" $.Values.kubernetesSecrets.license }}
  namespace: {{ $serverNamespace }}
spec:
  serviceAccountName: {{ $serviceAccountName }}
  secretProviderClassName: {{ $secretProviderClassName }}
  secretObject:
    type: Opaque
    data:
      - sourcePath: {{ $licenseKeyVaultSecret }}
        targetKey: userLicense
{{- if $.Values.localAuthenticationEnabled }}
{{- $localAuthenticationRevision := required "localAuthenticationRevision is required" $.Values.localAuthenticationRevision }}
---
apiVersion: secret-sync.x-k8s.io/v1alpha1
kind: SecretSync
metadata:
  name: {{ required "kubernetesSecrets.localAuthentication is required" $.Values.kubernetesSecrets.localAuthentication }}
  namespace: {{ $serverNamespace }}
spec:
  serviceAccountName: {{ $serviceAccountName }}
  secretProviderClassName: {{ $secretProviderClassName }}
  forceSynchronization: {{ $localAuthenticationRevision | quote }}
  secretObject:
    type: Opaque
    data:
      - sourcePath: {{ $.Values.secretStore.localAdminUsernameSecretName }}
        targetKey: username
      - sourcePath: {{ $.Values.secretStore.localAdminEmailSecretName }}
        targetKey: email
      - sourcePath: {{ $.Values.secretStore.localAdminPasswordSecretName }}
        targetKey: password
{{- end }}
{{- end }}
{{- end }}
