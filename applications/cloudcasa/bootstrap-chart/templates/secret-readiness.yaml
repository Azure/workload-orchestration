{{- $readinessName := required "readiness.name is required" .Values.readiness.name -}}
{{- $readinessImage := required "readiness.image is required" .Values.readiness.image -}}
{{- $serverNamespace := required "namespaces.server is required" .Values.namespaces.server -}}
{{- $mongoNamespace := required "namespaces.mongo is required" .Values.namespaces.mongo -}}
{{- range $namespace := list $serverNamespace $mongoNamespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $readinessName }}
  namespace: {{ $namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $readinessName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $readinessName }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: readiness
          image: {{ $readinessImage | quote }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: registry
              mountPath: /var/run/cloudcasa/registry
              readOnly: true
{{- if eq $namespace $serverNamespace }}
            - name: license
              mountPath: /var/run/cloudcasa/license
              readOnly: true
{{- if $.Values.localAuthenticationEnabled }}
            - name: local-authentication
              mountPath: /var/run/cloudcasa/local-authentication
              readOnly: true
{{- end }}
{{- end }}
      volumes:
        - name: registry
          secret:
            secretName: {{ required "kubernetesSecrets.registry is required" $.Values.kubernetesSecrets.registry }}
{{- if eq $namespace $serverNamespace }}
        - name: license
          secret:
            secretName: {{ required "kubernetesSecrets.license is required" $.Values.kubernetesSecrets.license }}
{{- if $.Values.localAuthenticationEnabled }}
        - name: local-authentication
          secret:
            secretName: {{ required "kubernetesSecrets.localAuthentication is required" $.Values.kubernetesSecrets.localAuthentication }}
{{- end }}
{{- end }}
{{- end }}
